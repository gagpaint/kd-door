<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현황판</title>
<meta name="theme-color" content="#1f6b4f">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
// 출고·회수 현황판으로 가는 문. 주소 끝에 ?go 가 있으면 바로 넘어간다.
var BOARD = "https://claude.ai/artifact/D6pJ1sLAX3SVJPhBUFxxVC";
if (/[?&]go\b/.test(location.search)) { location.replace(BOARD); }
</script>
<style>
:root{--bg:#eef1ef;--ink:#17201c;--muted:#5d6a64;--accent:#1f6b4f;--line:#d3dad6;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--ink:#e7ece9;--muted:#9aa8a1;--accent:#5cc49a;--line:#2f3a36;--card:#1b2220}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
ol{margin:0;padding-left:22px}
li{margin:4px 0}
b{color:var(--accent)}
a.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:10px}
p.m{color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<main>
  <h1>현황판 바로가기 만들기</h1>
  <div class="card">
    <ol>
      <li>오른쪽 위 <b>⋮</b> 메뉴를 눌러요.</li>
      <li><b>설치 및 바로가기 만들기</b> (또는 '홈 화면에 추가')를 눌러요.</li>
      <li>이름은 '현황판' 그대로 두고 <b>추가</b>.</li>
    </ol>
  </div>
  <p class="m">이 화면에서 만든 아이콘은 누르면 바로 출고·회수 현황판이 열려요.</p>
  <a class="btn" id="go" href="https://claude.ai/artifact/D6pJ1sLAX3SVJPhBUFxxVC">지금 현황판 열기</a>
</main>
<script>
// 바로가기가 이 주소(?go)로 만들어지도록 주소만 바꿔 둔다(새로 불러오지 않음).
try { history.replaceState(null, "", location.pathname + "?go"); } catch (e) {}
</script>
</body>
</html>
